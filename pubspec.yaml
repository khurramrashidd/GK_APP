name: gk_quiz_app
description: "A scalable, offline-first production ready General Knowledge application."
publish_to: 'none'

# versionName+versionCode. Bump the number after '+' on every Play Store upload;
# bump the part before '+' (1.0.0) when you want users to see a version change.
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management & DI
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Local NoSQL Caching Database
  isar: ^3.1.0
  isar_flutter_libs: ^3.1.0

  # Firebase Suite & Auth
  firebase_core: ^3.0.0
  cloud_firestore: ^5.0.0
  firebase_auth: ^5.0.0
  google_sign_in: ^6.2.1

  # Networking (Gemini REST calls)
  http: ^1.2.1

  # Opens Google search in a Chrome Custom Tab (in-app browser)
  url_launcher: ^6.3.0

  # Native share sheet for sharing score / rank
  share_plus: ^13.3.0

  # Utility Packages
  shared_preferences: ^2.2.3
  uuid: ^4.3.3
  path_provider: ^2.1.3
  file_picker: ^12.1.1

  # Optional location: used only to show local date/time in the drawer.
  # For human-readable city names instead of coordinates, run:
  #   flutter pub add geocoding
  # then fill `place` via placemarkFromCoordinates() in location_service.dart.
  geolocator: ^14.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation Tools
  build_runner: ^2.4.9
  riverpod_generator: ^2.3.11
  isar_generator: ^3.1.0

  # App icon generator — run `dart run flutter_launcher_icons` after editing
  # assets/icon/*.png to regenerate every Android/iOS icon size.
  flutter_launcher_icons: ^0.14.4

# Config for flutter_launcher_icons. image_path is the flattened light-background
# icon (legacy Android + iOS + base). The adaptive_icon_* keys additionally
# generate a proper Android 8+ adaptive icon (separate background/foreground
# layers, so it isn't clipped oddly by circular/squircle launcher masks), and
# adaptive_icon_monochrome wires up Android 13+'s themed icon, which is tinted
# to match the system's light/dark theme automatically.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon_light.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/icon_monochrome.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
